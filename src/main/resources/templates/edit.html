<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form method="post">

    <p style="color:red" th:text="${error}"></p>

    <input type="text" name="title" th:value="${noteForm.title}"/>

    <textarea name="content" th:text="${noteForm.content}"></textarea>

    <button type="submit">Update</button>

</form>
</body>
</html>
